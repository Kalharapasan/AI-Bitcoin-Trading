# Bitcoin Trading AI - Docker Compose Configuration
# Full stack with database, caching, monitoring, and application services

version: '3.8'

# ============================================================================
# Common Configuration
# ============================================================================
x-app-common: &app-common
  build:
    context: .
    target: runtime  # Change to 'development' for dev, 'gpu-runtime' for GPU
  image: bitcoin-trading-ai:latest
  restart: unless-stopped
  networks:
    - trading-network
  environment:
    # Application
    - APP_ENV=${APP_ENV:-production}
    - APP_DEBUG=${APP_DEBUG:-false}
    - APP_SECRET_KEY=${APP_SECRET_KEY:-change-this-in-production}
    
    # Database
    - DATABASE_TYPE=${DATABASE_TYPE:-postgresql}
    - DATABASE_HOST=postgres
    - DATABASE_PORT=5432
    - DATABASE_NAME=${DATABASE_NAME:-trading_ai}
    - DATABASE_USER=${DATABASE_USER:-postgres}
    - DATABASE_PASSWORD=${DATABASE_PASSWORD:-password}
    
    # Redis
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    - REDIS_DB=${REDIS_DB:-0}
    
    # Exchange API (use environment file for real keys)
    - EXCHANGE_NAME=${EXCHANGE_NAME:-binance}
    - EXCHANGE_TESTNET=${EXCHANGE_TESTNET:-true}
    
    # Trading
    - TRADING_SYMBOL=${TRADING_SYMBOL:-BTC/USDT}
    - TRADING_TIMEFRAME=${TRADING_TIMEFRAME:-1h}
    - INITIAL_CAPITAL=${INITIAL_CAPITAL:-10000}
    - RISK_PER_TRADE=${RISK_PER_TRADE:-0.02}
    
    # Logging
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - LOG_FILE=/app/logs/trading.log
    
    # Monitoring
    - METRICS_PORT=9090
    - HEALTH_CHECK_INTERVAL=30
    
    # Gunicorn
    - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
    - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
    
    # Celery
    - CELERY_BROKER_URL=redis://redis:6379/0
    - CELERY_RESULT_BACKEND=redis://redis:6379/0
    - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
  
  volumes:
    # Data persistence
    - trading-data:/app/data
    - trading-models:/app/models
    - trading-logs:/app/logs
    - trading-results:/app/results
    
    # Configuration (optional)
    - ./config:/app/config:ro
    - ./scripts:/app/scripts:ro
    
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# ============================================================================
# Services
# ============================================================================
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres
    restart: unless-stopped
    networks:
      - trading-network
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-trading_ai}
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    networks:
      - trading-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Main Web Application
  web:
    <<: *app-common
    container_name: trading-web
    ports:
      - "${WEB_PORT:-8000}:8000"  # FastAPI
      - "${METRICS_PORT:-9090}:9090"  # Metrics
    environment:
      - APP_MODE=web
    command: web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for async tasks
  worker:
    <<: *app-common
    container_name: trading-worker
    environment:
      - APP_MODE=worker
    command: worker
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.tasks inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat for scheduled tasks
  beat:
    <<: *app-common
    container_name: trading-beat
    environment:
      - APP_MODE=beat
    command: beat
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[c]elery beat'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Engine
  trading:
    <<: *app-common
    container_name: trading-engine
    environment:
      - APP_MODE=trading
      - TRADING_MODE=${TRADING_MODE:-paper}  # paper or live
    command: trading
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[p]ython main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Training Service
  training:
    <<: *app-common
    container_name: trading-training
    environment:
      - APP_MODE=training
    command: training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    volumes:
      - ./data:/app/data:rw
      - ./models:/app/models:rw
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import tensorflow as tf; print(tf.config.list_physical_devices(\"GPU\"))'"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Monitoring Stack - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: trading-prometheus
    restart: unless-stopped
    networks:
      - trading-network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: trading-grafana
    restart: unless-stopped
    networks:
      - trading-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development Tools (only in development)
  jupyter:
    <<: *app-common
    build:
      context: .
      target: development
    container_name: trading-jupyter
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      - APP_MODE=jupyter
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./core:/app/core:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
    command: jupyter
    profiles: ["develop"]

  # Database Admin (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading-pgadmin
    restart: unless-stopped
    networks:
      - trading-network
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@trading.ai}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    profiles: ["develop", "admin"]

  # Redis Admin (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trading-redis-commander
    restart: unless-stopped
    networks:
      - trading-network
    environment:
      - REDIS_HOSTS=local:redis:6379:0
      - HTTP_USER=admin
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    profiles: ["develop", "admin"]

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: trading-nginx
    restart: unless-stopped
    networks:
      - trading-network
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
      - grafana
    profiles: ["production"]

  # Backup Service
  backup:
    image: bitcoin-trading-ai:latest
    container_name: trading-backup
    restart: unless-stopped
    networks:
      - trading-network
    environment:
      - APP_MODE=backup
    volumes:
      - trading-data:/app/data:ro
      - trading-models:/app/models:ro
      - backup-data:/backups
      - ./scripts/backup_database.py:/app/scripts/backup_database.py:ro
    command: python scripts/backup_database.py
    profiles: ["production"]

# ============================================================================
# Networks
# ============================================================================
networks:
  trading-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  trading-data:
    driver: local
  trading-models:
    driver: local
  trading-logs:
    driver: local
  trading-results:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  pgadmin-data:
    driver: local
  backup-data:
    driver: local